name: Fork Verify

on:
  push:
    branches:
      - main
      - 'v1.*-hotreload'
  pull_request:
    branches:
      - main
      - 'v1.*-hotreload'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SINGBOX_TAGS: with_quic,with_utls,with_clash_api,with_v2ray_api

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -trimpath -tags "${SINGBOX_TAGS}" ./...

  test:
    name: Test with the race detector
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet -tags "${SINGBOX_TAGS}" ./...
      - name: Test
        run: go test -race -tags "${SINGBOX_TAGS}" ./common/inbounduser/... ./common/ja3/... ./common/sniff/... ./dns/transport/fakeip/... ./experimental/clashapi/... ./protocol/... ./transport/... github.com/sagernet/sing-quic/...
