name: Fork Vulncheck

on:
  push:
    branches:
      - main
      - 'v1.*-hotreload'
  pull_request:
    branches:
      - main
      - 'v1.*-hotreload'
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GOTOOLCHAIN: local
  GOVULNCHECK_VERSION: v1.9.0

jobs:
  govulncheck:
    name: govulncheck (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: shipped tags
            tags: with_quic,with_utls,with_clash_api,with_v2ray_api
          - name: default build
            tags: ""
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: 1.26.10
          cache: false
      - name: Install govulncheck
        run: go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
      - name: Scan
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: "0"
          SCAN_TAGS: ${{ matrix.tags }}
        run: |
          go version
          govulncheck -version
          govulncheck -tags "${SCAN_TAGS}" -show traces ./...
